[project]
name = "sdft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.0",
    "immutabledict>=4.3.1",
    "langdetect>=1.0.9",
    "lm-eval>=0.4.12",
    "matplotlib>=3.11.0",
    "peft>=0.19.1",
    "pyarrow>=25.0.0",
    "torch",
    "transformers>=5.13.1",
    "trl>=1.8.0",
    "vllm>=0.8.5.post1",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
