task: piqa_gen
dataset_path: baber/piqa
dataset_name: null
output_type: generate_until
training_split: train
validation_split: validation
test_split: null
doc_to_text: !function utils.piqa_doc_to_text
doc_to_target: !function utils.piqa_doc_to_target
should_decontaminate: true
doc_to_decontamination_query: goal
generation_kwargs:
  until: []
  do_sample: false
  temperature: 0.0
  max_gen_toks: 32
process_results: !function utils.process_piqa_results
metric_list:
  - metric: generation_accuracy
    aggregation: mean
    higher_is_better: true
  - metric: parse_valid_rate
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
